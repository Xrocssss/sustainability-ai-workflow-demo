name: Refresh public jobs
on:
  schedule:
    - cron: '17 2,14 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/refresh-jobs.mjs
      - run: node --test tests/*.test.mjs
      - name: Publish changed feed
        run: |
          if git diff --quiet -- data/jobs.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/jobs.json
          git commit -m 'data: refresh public job feed'
          git push
